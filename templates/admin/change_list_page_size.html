{% extends "admin/change_list_collapsible.html" %}

{% block search %}
  {{ block.super }}
  <div class="page-size-selector">
    <form method="get">
      {% for key, value in page_size_query_params %}
        <input type="hidden" name="{{ key }}" value="{{ value }}">
      {% endfor %}
      <label for="page-size">Records per page:</label>
      <select name="per_page" id="page-size" onchange="this.form.submit()">
        <option value="25" {% if cl.list_per_page == 25 %}selected{% endif %}>25</option>
        <option value="50" {% if cl.list_per_page == 50 %}selected{% endif %}>50</option>
        <option value="100" {% if cl.list_per_page == 100 %}selected{% endif %}>100</option>
      </select>
      <noscript><button type="submit" class="button">Apply</button></noscript>
    </form>
  </div>
{% endblock %}
