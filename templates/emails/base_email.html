<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block email_title %}BundleofGifts{% endblock %}</title>
  <style>
    @media only screen and (max-width: 620px) {
      .email-shell { width:100% !important; }
      .email-gutter { padding-left:16px !important; padding-right:16px !important; }
      .email-content { padding-top:22px !important; padding-bottom:22px !important; }
    }
  </style>
</head>
<body style="margin:0; padding:0; background-color:#f3f5f9; color:#243047; font-family:Arial,Helvetica,sans-serif;">
  <div style="display:none; max-height:0; overflow:hidden; opacity:0; color:transparent;">
    {% block email_preheader %}A message from BundleofGifts.{% endblock %}
  </div>
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color:#f3f5f9;">
    <tr>
      <td align="center" style="padding:28px 12px;">
        <table class="email-shell" role="presentation" width="600" cellspacing="0" cellpadding="0" border="0" style="width:100%; max-width:600px; background-color:#ffffff; border:1px solid #e2e8f0; border-radius:12px;">
          <tr>
            <td class="email-gutter" style="padding:22px 28px; border-bottom:1px solid #e9edf4;">
              <a href="{% block brand_home_url %}{{ brand_url }}{% endblock %}" style="display:inline-block; color:#29376b; font-size:20px; font-weight:700; text-decoration:none;">
                <img src="cid:{{ brand_icon_cid }}" width="36" height="36" alt="BundleofGifts gift box" style="display:inline-block; margin-right:8px; border:0; vertical-align:middle;">
                BundleofGifts
              </a>
            </td>
          </tr>
          <tr>
            <td class="email-gutter email-content" style="padding:30px 28px; font-size:15px; line-height:1.65;">
              {% block email_content %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td class="email-gutter" style="padding:20px 28px; border-top:1px solid #e9edf4; background-color:#fafbfc; color:#667085; font-size:13px; line-height:1.6;">
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                <tr><td style="padding-bottom:8px;">With care,<br><strong style="color:#29376b;">The BundleofGifts Team</strong> <img src="cid:{{ brand_icon_cid }}" width="18" height="18" alt="" style="display:inline-block; margin-left:4px; border:0; vertical-align:middle;"></td></tr>
                <tr><td style="padding-bottom:8px;">Need help? Reply to this email and we’ll be happy to assist.</td></tr>
                <tr><td>&copy; {% now "Y" %} BundleofGifts. All rights reserved.</td></tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
