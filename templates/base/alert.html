{% if messages %} {% for message in messages %}

<div
  class="alert alert-dismissible alert-{% if 'error' in message.tags %}danger{% elif message.tags %}{{ message.tags }}{% endif %}"
  role="alert"
  style="text-align: center"
>
  {{message}}

  <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>

{% endfor %} {% endif %}
